
services:

  # SERVIDOR NGINX
  nginx:
    image: nginx:stable-alpine
    container_name: kill-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - rede_frontend
    restart: unless-stopped

  # SERVIDOR PHP
  php:
    build: .
    container_name: kill-php
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - rede_frontend
      - rede_backend
    restart: unless-stopped

  # BANCO DE DADOS MYSQL
  mysql:
    image: mysql:8.4
    container_name: kill-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - rede_backend
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

# REDES DO DOCKER
networks:
  rede_frontend:
    driver: bridge

  rede_backend:
    driver: bridge
    internal: true

# ARMAZENAMENTO PERSISTENTE
volumes:
  mysql_data:
